
<html>
    <head>
        <title>Emscripten Math</title>
        <script src="module.js"></script>
        <script src="link.js" defer></script>
    </head>
    <main>
        <div><input type="number" id="first" value="10"></input>
        <input type="number" id="second" value="10"></input></div>

        <p>Scrambled string:</p> <h3 id="scrambledtext"></h3>
        
    </main>
