<html>
    <head>
        <title>Invert Image colors</title>
        <script src="module.js"></script>
        <script src="link.js" defer></script>
    </head>

    <body>
        <h2>Import File</h2>
        <input type="file" accept= '.bmp' id="bmpinput">
        <button id="invertButton">Invert!</button>

        <div class="preview-container">
        <div>
            <h3>Original</h3>
            <img id="originalPreview" alt="Original image preview will appear here">
        </div>
        <div>
            <h3>Processed (C++)</h3>
            <img id="resultPreview" alt="Processed image preview will appear here">
        </div>
    </div>
    </body>
</html>
